name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore and test
        run: |
          npm ci
          dotnet tool restore
          dotnet restore ShoppyShop.slnx --locked-mode
          dotnet build ShoppyShop.slnx -c Release --no-restore
          dotnet test ShoppyShop.slnx -c Release --no-build
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          npx --yes @railway/cli@latest up
          --ci
          --project "${{ vars.RAILWAY_PROJECT_ID }}"
          --environment "${{ vars.RAILWAY_ENVIRONMENT_ID }}"
          --service "${{ vars.RAILWAY_SERVICE_ID }}"
