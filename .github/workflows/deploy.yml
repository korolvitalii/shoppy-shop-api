name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  # The whole CI job, on the commit being deployed: tests, NuGet audit, formatting, CDK synth,
  # container build and Trivy scan. Railway is reached only if every one of them passes.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Railway builds the Dockerfile from this commit; it does not receive the image the checks
      # scanned. The Dockerfile pins its base images by digest and restores in locked mode, so that
      # build starts from the same inputs the scan saw.
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          npx --yes @railway/cli@latest up
          --ci
          --project "${{ vars.RAILWAY_PROJECT_ID }}"
          --environment "${{ vars.RAILWAY_ENVIRONMENT_ID }}"
          --service "${{ vars.RAILWAY_SERVICE_ID }}"
